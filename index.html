<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LetStudy AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    h1, h2 {
      color: #38bdf8;
    }
    textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    textarea {
      min-height: 120px;
    }
    button {
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary {
      background: #22c55e;
      margin-top: 5px;
    }
    section {
      margin-top: 30px;
      background: #020617;
      padding: 20px;
      border-radius: 12px;
    }
    .question {
      margin-top: 15px;
    }
  </style>
</head>
<body>

<h1>📘 LetStudy AI</h1>

<!-- INPUT SECTION -->
<section>
  <h2>What do you want to study?</h2>
  <textarea id="topicInput" placeholder="Example: Photosynthesis"></textarea>
  <button onclick="teachMe()">Teach Me</button>
</section>

<!-- AI EXPLANATION SECTION -->
<section id="explanationSection" hidden>
  <h2>🧠 AI Explanation</h2>
  <div id="explanationContent"></div>
  <button class="secondary" onclick="toggleSpeech()">🔊 Read Aloud</button>
</section>

<!-- QUIZ SECTION -->
<section id="quizSection" hidden>
  <h2>📝 Quiz</h2>
  <div id="quizContent"></div>
  <button onclick="submitQuiz()">Submit Quiz</button>
</section>

<!-- RESULT SECTION -->
<section id="resultSection" hidden>
  <h2>✅ Result</h2>
  <p id="resultText"></p>
</section>

<!-- YOUTUBE SECTION -->
<section id="youtubeSection" hidden>
  <h2>🎥 Recommended Videos</h2>
  <div id="youtubeVideos"></div>
</section>

<script>
let speech;
let quizAnswers = [];

async function teachMe() {
  const topic = document.getElementById("topicInput").value.trim();
  if (!topic) return alert("Enter a topic");

  const res = await fetch("/api/study", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ topic })
  });

  const data = await res.json();

  document.getElementById("explanationContent").innerHTML = `
    <h3>Definition</h3>
    <p>${data.definition}</p>

    <h3>Key Points</h3>
    <ul>${data.keyPoints.map(k => `<li>${k}</li>`).join("")}</ul>

    <h3>Examples</h3>
    <ul>${data.examples.map(e => `<li>${e}</li>`).join("")}</ul>
  `;

  speech = new SpeechSynthesisUtterance(
    data.definition + " " + data.keyPoints.join(". ") + " " + data.examples.join(". ")
  );

  document.getElementById("explanationSection").hidden = false;

  renderQuiz(data.quiz);
  loadYouTube(topic);
}

function toggleSpeech() {
  if (speechSynthesis.speaking) {
    speechSynthesis.cancel();
  } else {
    speechSynthesis.speak(speech);
  }
}

function renderQuiz(quiz) {
  quizAnswers = quiz.map(q => q.answer);

  document.getElementById("quizContent").innerHTML = quiz.map((q, i) => `
    <div class="question">
      <p>${i + 1}. ${q.question}</p>
      ${q.options.map(opt =>
        `<label>
          <input type="radio" name="q${i}" value="${opt}">
          ${opt}
        </label><br>`
      ).join("")}
    </div>
  `).join("");

  document.getElementById("quizSection").hidden = false;
}

function submitQuiz() {
  let score = 0;

  quizAnswers.forEach((ans, i) => {
    const chosen = document.querySelector(`input[name="q${i}"]:checked`);
    if (chosen && chosen.value === ans) score++;
  });

  document.getElementById("resultText").innerText =
    `You scored ${score} / ${quizAnswers.length}`;

  document.getElementById("resultSection").hidden = false;
}

async function loadYouTube(topic) {
  const res = await fetch(`/api/youtube?topic=${encodeURIComponent(topic)}`);
  const data = await res.json();

  document.getElementById("youtubeVideos").innerHTML =
    data.videos.map(v => `
      <iframe width="300" height="170"
        src="https://www.youtube.com/embed/${v}"
        allowfullscreen>
      </iframe>
    `).join("");

  document.getElementById("youtubeSection").hidden = false;
}
</script>

</body>
</html>
